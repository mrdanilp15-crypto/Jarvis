[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-core"
version = "0.1.0"
description = "JARVIS Referenz-Kern: Orchestrator, LLM-Gateway, Policy-Engine, Memory, Automationen, Connectoren"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0", "httpx>=0.27"]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "psutil>=5.9", "cryptography>=42", "segno>=1.6"]
connectors = ["websockets>=13", "aiomqtt>=2.3", "redis>=5.0", "asyncpg>=0.29"]
voice = ["wyoming>=1.5"]
# Lokale Spracherkennung (Whisper + Aktivierungswort) und lokale Stimme ohne Docker – der Windows-Installer nimmt sie mit
voice-local = ["faster-whisper>=1.1", "openwakeword>=0.6", "onnxruntime>=1.17", "numpy>=1.24", "piper-tts>=1.2"]
dev = ["pytest>=8", "fastapi>=0.115", "httpx>=0.27", "anthropic>=1.0", "wyoming>=1.5", "websockets>=13", "psutil>=5.9", "cryptography>=42", "segno>=1.6",
       "uvicorn>=0.30"]
all = [
    "jarvis-core[llm,server,connectors,voice]",
]

[project.scripts]
jarvis-demo = "jarvis.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
faulthandler_timeout = 60  # hängt ein Test, gibt es nach 60 s einen Stacktrace statt Stillstand
