openapi: 3.1.0
info:
  title: JARVIS API
  version: 1.0.0
  summary: REST-Schnittstelle des JARVIS-Kerns (jarvis-core)
  description: |
    Authentifizierung: `Authorization: Bearer <token>` (OIDC-Access-Token oder Geräte-Token).
    Trust-Stufe und Actor werden **immer serverseitig** aus dem Token bestimmt.
    Fehler folgen RFC 9457 (`application/problem+json`, Schema `error.schema.json`).
    Streaming (Token-Deltas, Audio) läuft über den WebSocket `/v1/stream`, siehe docs/04 Abschnitt 4.2.3.
servers:
  - url: https://jarvis.home.example
security:
  - bearer: []

tags:
  - name: Konversation
  - name: Events
  - name: Aktionen
  - name: Automationen
  - name: Aufgaben
  - name: Memory
  - name: Plugins
  - name: Einstellungen
  - name: System

paths:
  /v1/conversations/{conversation_id}/messages:
    post:
      tags: [Konversation]
      summary: Nachricht senden und Antwort erhalten (nicht gestreamt)
      operationId: postMessage
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text: { type: string, minLength: 1, maxLength: 32000 }
                mode: { enum: [normal, night, away, guest, party, vacation], default: normal }
                channel: { enum: [app, desktop, web, api], default: app }
            example: { text: "Wie warm ist es im Wohnzimmer?" }
      responses:
        "200":
          description: Antwort des Assistenten inkl. ausgelöster Aktionen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TurnResult" }
              example:
                text: "Im Wohnzimmer sind es 20,5 Grad, Sir."
                route: "llm:ollama"
                stop_reason: end_turn
                tainted: false
                actions: []
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/events:
    post:
      tags: [Events]
      summary: Event einspeisen (CloudEvents 1.0)
      description: |
        `trust` und `actor` im Payload werden ignoriert und aus dem Token gesetzt.
        Erlaubte Event-Typen hängen vom Token-Scope ab (z. B. Plugins nur ihre deklarierten Typen).
      operationId: ingestEvent
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema: { $ref: "../schemas/event.schema.json" }
          application/json:
            schema: { $ref: "../schemas/event.schema.json" }
      responses:
        "202":
          description: Angenommen
          content:
            application/json:
              schema: { type: object, properties: { accepted: { type: string } } }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /v1/webhooks/{hook_id}:
    post:
      tags: [Events]
      summary: Eingehender, HMAC-signierter Webhook
      security: []
      operationId: receiveWebhook
      parameters:
        - { name: hook_id, in: path, required: true, schema: { type: string, pattern: "^whk_[a-z0-9_]+$" } }
        - { name: X-Jarvis-Timestamp, in: header, required: true, schema: { type: string } }
        - { name: X-Jarvis-Signature, in: header, required: true, schema: { type: string, pattern: "^sha256=[0-9a-f]{64}$" } }
        - { name: X-Jarvis-Delivery, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "202": { description: "Angenommen – erzeugt jarvis.webhook.received (Trust external_untrusted)" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/actions:
    post:
      tags: [Aktionen]
      summary: Capability direkt ausführen (läuft durch die Policy-Engine)
      operationId: requestAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capability, arguments]
              properties:
                capability: { type: string, examples: ["home.set_light"] }
                arguments: { type: object }
                idempotency_key: { type: string }
                dry_run: { type: boolean, default: false }
      responses:
        "200":
          description: Ergebnis (auch pending_confirmation oder denied)
          content:
            application/json:
              schema: { $ref: "../schemas/action-result.schema.json" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/actions/{action_id}:
    get:
      tags: [Aktionen]
      summary: Status einer Aktion
      operationId: getAction
      parameters:
        - { name: action_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Aktion
          content:
            application/json:
              schema: { $ref: "../schemas/action-result.schema.json" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/confirmations/{confirmation_id}:
    post:
      tags: [Aktionen]
      summary: Offene Bestätigung freigeben oder ablehnen
      description: Nur die anfragende Person oder ein Admin. R3 verlangt `app_biometric` oder `pin` (signierte Geräte-Challenge).
      operationId: resolveConfirmation
      parameters:
        - { name: confirmation_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, method]
              properties:
                decision: { enum: [approve, reject] }
                method: { enum: [app, app_biometric, pin] }
                attestation: { type: string, description: "Signierte Challenge des Geräts (Betrieb)" }
      responses:
        "200":
          description: Aktualisierte Aktion
          content:
            application/json:
              schema: { $ref: "../schemas/action-result.schema.json" }
        "403": { $ref: "#/components/responses/Problem" }

  /v1/automations:
    get:
      tags: [Automationen]
      summary: Automationen auflisten
      operationId: listAutomations
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema: { type: array, items: { $ref: "../schemas/automation.schema.json" } }
    post:
      tags: [Automationen]
      summary: Automation anlegen (vorgeschlagene Automationen starten deaktiviert)
      operationId: createAutomation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/automation.schema.json" }
      responses:
        "201": { description: Angelegt }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/automations/{automation_id}:dry-run:
    post:
      tags: [Automationen]
      summary: Automation gegen die Event-Historie simulieren
      operationId: dryRunAutomation
      parameters:
        - { name: automation_id, in: path, required: true, schema: { type: string } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 14 } }
      responses:
        "200":
          description: Simulationsergebnis
          content:
            application/json:
              schema:
                type: object
                properties:
                  would_have_run: { type: integer }
                  conflicts: { type: array, items: { type: string } }
                  sample_traces: { type: array, items: { type: object } }

  /v1/tasks:
    get:
      tags: [Aufgaben]
      summary: Aufgaben, Erinnerungen, Timer und Jobs
      operationId: listTasks
      parameters:
        - { name: type, in: query, schema: { enum: [todo, reminder, timer, job, plan] } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200": { description: Liste }
    post:
      tags: [Aufgaben]
      summary: Aufgabe anlegen
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, title]
              properties:
                type: { enum: [todo, reminder, timer, job, plan] }
                title: { type: string }
                due_at: { type: string, format: date-time }
                trigger: { type: object }
                list_name: { type: string }
      responses:
        "201": { description: Angelegt }

  /v1/memory:
    get:
      tags: [Memory]
      summary: Gedächtnis durchsuchen („Was weißt du über mich?“)
      operationId: searchMemory
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { enum: [episodic, semantic, procedural, preference] } }
      responses:
        "200":
          description: Treffer
          content:
            application/json:
              schema: { type: array, items: { $ref: "../schemas/memory-item.schema.json" } }
  /v1/memory/{memory_id}:
    delete:
      tags: [Memory]
      summary: Erinnerung vergessen
      operationId: forgetMemory
      parameters:
        - { name: memory_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Gelöscht }
  /v1/memory/export:
    get:
      tags: [Memory]
      summary: Alle eigenen Erinnerungen exportieren (DSGVO Art. 20)
      operationId: exportMemory
      responses:
        "200": { description: JSON-Export }

  /v1/plugins:
    get:
      tags: [Plugins]
      summary: Installierte Plugins
      operationId: listPlugins
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema: { type: array, items: { $ref: "../schemas/plugin-manifest.schema.json" } }
    post:
      tags: [Plugins]
      summary: Plugin installieren (Admin; Berechtigungen müssen danach freigegeben werden)
      operationId: installPlugin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/plugin-manifest.schema.json" }
      responses:
        "202": { description: "Installiert, wartet auf Freigabe" }

  /v1/persona:
    get:
      tags: [System]
      summary: Aktive Persona
      operationId: getPersona
      responses:
        "200":
          description: Persona
          content:
            application/json:
              schema: { $ref: "../schemas/persona.schema.json" }
    put:
      tags: [System]
      summary: Persona wechseln oder anpassen
      operationId: setPersona
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/persona.schema.json" }
      responses:
        "200": { description: Aktualisiert }

  /v1/settings/llm:
    get:
      tags: [Einstellungen]
      summary: KI-Modell – lokales Modell, Claude und Modus
      description: |
        Nur Erwachsene des Haushalts. Der Claude-Schlüssel erscheint nie im Klartext, nur als `key_hint` („…abcd“).
      operationId: getLlmSettings
      responses:
        "200":
          description: Aktuelle Auswahl
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmSettings" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      tags: [Einstellungen]
      summary: Lokales Modell, Claude-Modell oder Modus wechseln
      operationId: setLlmSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                local_model: { type: string, maxLength: 120, examples: ["qwen2.5:7b-instruct"] }
                claude_model: { enum: [claude-opus-5-5, claude-sonnet-5-5, claude-fable-5-1] }
                mode: { enum: [auto, cloud, local], description: "auto = schwierige Fragen an Claude; Sensibles bleibt immer lokal" }
      responses:
        "200":
          description: Neue Auswahl
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmSettings" }
        "422": { $ref: "#/components/responses/Problem" }

  /v1/settings/llm/pull:
    post:
      tags: [Einstellungen]
      summary: Lokales Modell herunterladen (Ollama)
      description: Läuft im Hintergrund; Fortschritt in `local.pull` von GET /v1/settings/llm.
      operationId: pullModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model: { type: string, maxLength: 120 }
                activate: { type: boolean, default: true, description: "nach dem Download direkt verwenden" }
      responses:
        "202": { description: Download gestartet }

  /v1/settings/llm/claude-key:
    put:
      tags: [Einstellungen]
      summary: Claude-API-Schlüssel prüfen und speichern
      description: |
        Prüft den Schlüssel kostenlos über die Models-API und speichert ihn nur bei Erfolg – serverseitig im
        Datenverzeichnis (Dateirechte 0600). Er hat Vorrang vor `ANTHROPIC_API_KEY`.
      operationId: setClaudeKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string, minLength: 10, maxLength: 300, writeOnly: true }
      responses:
        "200":
          description: Gespeichert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmSettings" }
        "400": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Einstellungen]
      summary: Gespeicherten Schlüssel entfernen (danach gilt wieder deploy/.env, falls gesetzt)
      operationId: deleteClaudeKey
      responses:
        "200": { description: Entfernt }
  /v1/settings/devices:
    get:
      tags: [Einstellungen]
      summary: Gekoppelte Raumgeräte, Heimnetz-Adressen und Räume aus Home Assistant
      operationId: listDevices
      responses:
        "200":
          description: Geräte (ohne Token), Räume, Heimnetz-Zugang
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices: { type: array, items: { $ref: "#/components/schemas/RoomDevice" } }
                  rooms:
                    type: array
                    items: { type: object, properties: { id: { type: string }, name: { type: string } } }
                  lan:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      urls: { type: array, items: { type: string } }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Einstellungen]
      summary: Tablet/Handy für einen Raum koppeln – liefert Link und QR-Code (nur einmal sichtbar)
      description: Nur Erwachsene des Haushalts, nicht von einem gekoppelten Gerät aus. Erfordert `JARVIS_LAN=on`.
      operationId: addDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 40 }
                area: { type: [string, "null"], maxLength: 80, description: area_id aus Home Assistant oder Raumname }
      responses:
        "200":
          description: Gekoppelt
          content:
            application/json:
              schema:
                type: object
                properties:
                  device: { $ref: "#/components/schemas/RoomDevice" }
                  url: { type: string, description: "https://<PC>:8443/#token=…&wake=1&room=…" }
                  qr_svg: { type: [string, "null"] }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/settings/devices/{device_id}:
    delete:
      tags: [Einstellungen]
      summary: Gerät entkoppeln (Zugang sofort ungültig)
      operationId: removeDevice
      parameters:
        - { name: device_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Entfernt }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/presence:
    post:
      tags: [Sehen]
      summary: Anwesenheit aus der Kamera der Oberfläche melden (nur der Zustand, nie ein Bild)
      description: |
        Veröffentlicht `jarvis.presence.changed` auf dem Bus. Bei `arrived` kommt eine Begrüßung zurück, mit dem
        nächsten Termin der kommenden drei Stunden. Gäste ausgeschlossen.
      operationId: reportPresence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { enum: [arrived, left] }
                away_minutes: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Begrüßung (bei arrived) oder null
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: [string, "null"] }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/vision:
    post:
      tags: [Sehen]
      summary: Ein Kamerabild beschreiben (lokales Bildmodell, Bild wird nicht gespeichert)
      description: Gäste ausgeschlossen. Fehlt das Bildmodell, lädt JARVIS es nach und meldet das.
      operationId: describeImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, description: "Data-URL (JPEG/PNG/WebP), höchstens 4 MB" }
                question: { type: string, maxLength: 500, default: "Was siehst du?" }
      responses:
        "200":
          description: Beschreibung
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
                  model: { type: string }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/automations/suggestions:
    get:
      tags: [Einstellungen]
      summary: Gelernte Gewohnheiten – Vorschläge und angenommene Routinen
      operationId: listRoutineSuggestions
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        entity_id: { type: string }
                        name: { type: string }
                        action: { enum: ["on", "off", "open", "close"] }
                        daytype: { enum: [weekday, weekend] }
                        clock: { type: string, examples: ["6:45"] }
                        days: { type: integer }
                        of_days: { type: integer }
                        status: { enum: [new, accepted, rejected] }
                        text: { type: string }
  /v1/automations/suggestions/{suggestion_id}:
    post:
      tags: [Einstellungen]
      summary: Vorschlag übernehmen (accept=true) oder ablehnen bzw. Routine beenden (accept=false)
      operationId: decideRoutineSuggestion
      parameters:
        - { name: suggestion_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accept]
              properties:
                accept: { type: boolean }
      responses:
        "200": { description: Entschieden }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/settings/home:
    get:
      tags: [Einstellungen]
      summary: Smart Home – Verbindung zu Home Assistant, gefundene Adressen, Räume und Geräte
      description: Nur Erwachsene des Haushalts. Das Zugriffstoken wird nie zurückgegeben.
      operationId: getHomeSettings
      responses:
        "200":
          description: Zustand
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeSettings" }
        "403": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Einstellungen]
      summary: Verbindung zu Home Assistant trennen (gespeicherten Zugang löschen)
      operationId: deleteHomeSettings
      responses:
        "200": { description: Getrennt }
  /v1/settings/home/discover:
    post:
      tags: [Einstellungen]
      summary: Home Assistant im Heimnetz suchen (bekannte Adressen und das eigene /24-Netz, Port 8123)
      operationId: discoverHome
      responses:
        "200":
          description: Gefundene Adressen in `found`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeSettings" }
  /v1/settings/home/oauth:
    post:
      tags: [Einstellungen]
      summary: Anmeldung bei Home Assistant starten (OAuth/IndieAuth)
      description: |
        Liefert die Adresse der HA-Anmeldeseite. Nach der Anmeldung leitet Home Assistant zu
        `GET /v1/settings/home/oauth?code=…&state=…` zurück; JARVIS legt sich dann einen langlebigen Zugang an und
        speichert ihn serverseitig (Dateirechte 0600).
      operationId: startHomeOAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, examples: ["http://homeassistant.local:8123"] }
      responses:
        "200":
          description: Anmeldeseite
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorize_url: { type: string }
  /v1/settings/home/token:
    put:
      tags: [Einstellungen]
      summary: Mit Adresse und langlebigem Zugriffstoken verbinden (wird vor dem Speichern geprüft)
      operationId: setHomeToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, token]
              properties:
                url: { type: string }
                token: { type: string, minLength: 20, maxLength: 600, writeOnly: true }
      responses:
        "200":
          description: Verbunden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeSettings" }
        "401": { $ref: "#/components/responses/Problem" }

  /v1/system/health:
    get:
      tags: [System]
      summary: Gesundheitszustand
      security: []
      operationId: health
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { enum: [ok, degraded, down] }
                  cloud_llm: { enum: [closed, open, half_open] }
                  local_llm: { enum: [unknown, loading, ready, missing_model, unavailable] }
                  llm:
                    type: object
                    properties:
                      local_model: { type: string }
                      cloud_model: { type: [string, "null"] }
                      mode: { enum: [auto, cloud, local] }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema: { type: string, maxLength: 128 }
  responses:
    Problem:
      description: Fehler (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "../schemas/error.schema.json" }
  schemas:
    RoomDevice:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        area: { type: [string, "null"] }
        area_name: { type: [string, "null"] }
        created: { type: string, format: date-time }
    LlmSettings:
      type: object
      properties:
        mode: { enum: [auto, cloud, local] }
        local:
          type: object
          properties:
            model: { type: string }
            status: { type: string }
            reachable: { type: boolean }
            installed: { type: array, items: { type: object } }
            suggested: { type: array, items: { type: object } }
            pull: { type: [object, "null"], description: "model, status, completed, total, done, error" }
        cloud:
          type: object
          properties:
            configured: { type: boolean }
            source: { enum: [ui, env, null] }
            key_hint: { type: [string, "null"], examples: ["…a1b2"] }
            model: { type: string }
            models: { type: array, items: { type: object } }
            state: { enum: [closed, open, half_open] }
    HomeSettings:
      type: object
      properties:
        configured: { type: boolean }
        source: { enum: [ui, env, null] }
        url: { type: [string, "null"] }
        connected: { type: boolean }
        name: { type: [string, "null"], description: Name des Zuhauses in Home Assistant }
        version: { type: [string, "null"] }
        error: { type: [string, "null"] }
        devices: { type: integer }
        rooms:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              devices: { type: array, items: { type: object, properties: { name: { type: string }, domain: { type: string } } } }
        found: { type: array, items: { type: string } }
        scanning: { type: boolean }
    TurnResult:
      type: object
      required: [text, route, stop_reason, tainted, actions]
      properties:
        text: { type: string }
        route: { type: string, description: "fast_path | research | conversation | confirmation_resolver | llm:<provider>[:research]" }
        stop_reason: { enum: [end_turn, tool_use, max_tokens, refusal, max_iterations, timeout] }
        tainted: { type: boolean }
        actions:
          type: array
          items: { $ref: "../schemas/action-result.schema.json" }
        pending_confirmation:
          type: object
          properties:
            confirmation_id: { type: string }
            method: { enum: [voice, app, app_biometric, pin] }
            prompt: { type: string }
            expires_at: { type: string, format: date-time }
        awaiting_reply: { type: boolean, description: "JARVIS hat nachgefragt – die Oberfläche hört direkt wieder zu" }
        card:
          type: object
          description: "Karte für die Oberfläche – z. B. der E-Mail-Entwurf, während der E-Mail-Assistent nachfragt"
          required: [type]
          properties:
            type: { enum: [mail] }
            to: { type: string }
            subject: { type: string }
            body: { type: string }
            step: { enum: [to, subject, body, done, failed, cancel] }
